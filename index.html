<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Office Asset List (Live Update)</title>

<style>
  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
  }
  h2 {
    text-align: center;
    margin-bottom: 20px;
  }
  #controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }
  button {
    background-color: #1976d2;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover {
    background-color: #1565c0;
  }
  input[type="text"], td input {
    padding: 6px;
    width: 95%;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
  }
  th {
    background-color: #1976d2;
    color: white;
  }
  tr:nth-child(even) {
    background-color: #f9f9f9;
  }
  .edit-btn {
    background-color: #43a047;
  }
  .delete-btn {
    background-color: #e53935;
  }
  #status {
    text-align: center;
    margin-top: 10px;
    font-style: italic;
  }
</style>
</head>

<body>

<h2>🏢 Office Asset List (Live Google Sheet)</h2>

<div id="controls">
  <button id="loadGoogle">🔄 Load from Google Sheet</button>
  <button id="addRow">➕ Add New Asset</button>
  <button id="exportExcel">📤 Export to Excel</button>
  <input type="text" id="searchBox" placeholder="🔍 Search..." />
</div>

<table id="assetTable">
  <thead>
    <tr>
      <th>No</th>
      <th>Equipment</th>
      <th>Equipment Description</th>
      <th>Serial Number</th>
      <th>DOK B-CORD</th>
      <th>User</th>
      <th>Location</th>
      <th>Edit</th>
      <th>Delete</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<p id="status">Ready.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
const tableBody = document.querySelector("#assetTable tbody");
const status = document.getElementById("status");
const searchBox = document.getElementById("searchBox");
let allRecords = [];

// ---------- HEADER MATCH ----------
function normalizeHeader(h) {
  return h.toLowerCase().replace(/\s|_/g, "");
}
function matchHeader(headers, names) {
  const n = headers.map(normalizeHeader);
  for (let name of names) {
    const i = n.indexOf(normalizeHeader(name));
    if (i !== -1) return headers[i];
  }
  return null;
}

// ---------- INDEX UPDATE ----------
function updateIndexes() {
  let i = 1;
  document.querySelectorAll("#assetTable tbody tr").forEach(row => {
    if (row.style.display !== "none") {
      row.querySelector(".row-index").textContent = i++;
    }
  });
}

// ---------- DISPLAY DATA ----------
function displayData(records) {
  tableBody.innerHTML = "";
  if (!records.length) {
    status.textContent = "No data found.";
    return;
  }

  const headers = Object.keys(records[0]);
  const k = {
    eq: matchHeader(headers, ["Equipment"]),
    desc: matchHeader(headers, ["Equipment Description"]),
    ser: matchHeader(headers, ["Serial Number"]),
    dok: matchHeader(headers, ["DOK B-CORD"]),
    user: matchHeader(headers, ["User"]),
    loc: matchHeader(headers, ["Location"])
  };

  records.forEach(r => {
    if (!r[k.eq]) return;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="row-index"></td>
      <td>${r[k.eq]}</td>
      <td>${r[k.desc]}</td>
      <td>${r[k.ser]}</td>
      <td>${r[k.dok]}</td>
      <td>${r[k.user]}</td>
      <td>${r[k.loc]}</td>
      <td><button class="edit-btn" onclick="editRow(this)">Edit</button></td>
      <td><button class="delete-btn" onclick="deleteRow(this)">Delete</button></td>
    `;
    tableBody.appendChild(tr);
  });

  updateIndexes();
  status.textContent = `✅ Loaded ${tableBody.rows.length} assets`;
}

// ---------- EDIT / DELETE ----------
window.editRow = btn => {
  const row = btn.closest("tr");
  const cells = row.querySelectorAll("td");
  if (btn.textContent === "Edit") {
    for (let i = 1; i <= 6; i++) {
      const v = cells[i].textContent;
      cells[i].innerHTML = `<input value="${v}">`;
    }
    btn.textContent = "Save";
  } else {
    for (let i = 1; i <= 6; i++) {
      cells[i].textContent = cells[i].querySelector("input").value;
    }
    btn.textContent = "Edit";
  }
};

window.deleteRow = btn => {
  if (confirm("Delete this record?")) {
    btn.closest("tr").remove();
    updateIndexes();
    status.textContent = "🗑️ Row deleted.";
  }
};

// ---------- ADD ROW ----------
document.getElementById("addRow").onclick = () => {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td class="row-index"></td>
    <td><input></td>
    <td><input></td>
    <td><input></td>
    <td><input></td>
    <td><input></td>
    <td><input></td>
    <td><button class="edit-btn" onclick="saveNewRow(this)">Save</button></td>
    <td><button class="delete-btn" onclick="deleteRow(this)">Delete</button></td>
  `;
  tableBody.appendChild(tr);
  updateIndexes();
};

window.saveNewRow = btn => {
  const row = btn.closest("tr");
  const inputs = row.querySelectorAll("input");
  row.innerHTML = `
    <td class="row-index"></td>
    ${[...inputs].map(i => `<td>${i.value}</td>`).join("")}
    <td><button class="edit-btn" onclick="editRow(this)">Edit</button></td>
    <td><button class="delete-btn" onclick="deleteRow(this)">Delete</button></td>
  `;
  updateIndexes();
};

// ---------- SEARCH ----------
searchBox.onkeyup = () => {
  const q = searchBox.value.toLowerCase();
  document.querySelectorAll("#assetTable tbody tr").forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(q) ? "" : "none";
  });
  updateIndexes();
};

// ---------- EXPORT ----------
document.getElementById("exportExcel").onclick = () => {
  const data = [["No","Equipment","Description","Serial","DOK","User","Location"]];
  document.querySelectorAll("#assetTable tbody tr").forEach(r => {
    const c = r.querySelectorAll("td");
    if (r.style.display !== "none") {
      data.push([...c].slice(0,7).map(td => td.textContent));
    }
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), "Assets");
  XLSX.writeFile(wb, "Office_Asset_List.xlsx");
};

// ---------- GOOGLE SHEET LOAD ----------
const GOOGLE_SHEET_CSV_URL =
  "https://docs.google.com/spreadsheets/d/1UjaZ2GcqlAW4vQWl1F37zp7DBgCpwbYdTEnqSzJqN5I/export?format=csv";

async function loadFromGoogle() {
  try {
    status.textContent = "⏳ Loading...";
    const res = await fetch(GOOGLE_SHEET_CSV_URL);
    const csv = await res.text();
    const wb = XLSX.read(csv, { type: "string" });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
    displayData(json);
  } catch {
    status.textContent = "❌ Google Sheet load error";
  }
}

document.getElementById("loadGoogle").onclick = loadFromGoogle;
loadFromGoogle();
setInterval(loadFromGoogle, 60000);
</script>

</body>
</html>
