<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Office Asset List – Always Show Empty User</title>
    <style>
        body { font-family: Segoe UI; background:#f4f6f8; padding:20px }
        h2 { text-align:center; margin-bottom:10px }

        #controls,#filters { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:10px }
        button { padding:5px 10px; border:none; border-radius:5px; cursor:pointer }
        .filter-btn { background:#546e7a; color:white; }
        .filter-btn.active { background:#2e7d32; }
        .edit-btn { background:#43a047; color:white }
        .delete-btn { background:#e53935; color:white }

        table { width:100%; border-collapse:collapse; background:#fff; margin-top:10px }
        th,td { border:1px solid #ccc; padding:8px; text-align:center }
        th { background:#1976d2; color:#fff }

        .status { cursor:pointer; font-weight:bold; padding:4px 12px; border-radius:14px; display:inline-block }
        .active { background:#e8f5e9; color:#2e7d32 }
        .inactive { background:#fdecea; color:#c62828 }
    </style>
</head>
<body>

<h2>🏢 Office Asset List – Empty User Always Visible</h2>

<div id="controls">
    <button onclick="loadData()">🔄 Reload</button>
    <button onclick="addRow()">➕ Add Asset</button>
    <input id="searchBox" placeholder="🔍 Search...">
</div>

<div id="summary"></div>

<table>
    <thead>
    <tr>
        <th>No</th>
        <th>Equipment</th>
        <th>Description</th>
        <th>Serial</th>
        <th>DOK</th>
        <th>User</th>
        <th>Location</th>
        <th>Status</th>
        <th>Edit</th>
        <th>Delete</th>
    </tr>
    </thead>
    <tbody id="tbody"></tbody>
</table>

<script>
    const API = "https://script.google.com/macros/s/AKfycbwXpn362zREgNE_K0JasXzNVOcW8u0XlGimELEmVUtIMkz2IF3ohFyPR8EjJnbAd0bSBQ/exec";

    const tbody = document.getElementById("tbody");
    const searchBox = document.getElementById("searchBox");
    const summary = document.getElementById("summary");

    let allData = [];
    let filterStatusValue = "ALL"; // Can be "ALL" or "Active" only

    // Load data
    async function loadData() {
        const res = await fetch(API);
        allData = await res.json();
        render();
    }

    // Render table
    function render() {
        tbody.innerHTML = "";
        let index = 1, activeCount = 0, inactiveCount = 0;

        allData.forEach(r=>{
            const userVal = (r.User||"").trim();
            const isEmptyUser = userVal==="";
            const status = isEmptyUser ? "Inactive" : (r.Status||"Active");

            // Auto-fix backend if User empty
            if(isEmptyUser && r.Status!=="Inactive"){
                updateRow(r._rowIndex,{Status:"Inactive"});
            }

            // Count totals
            if(status==="Active") activeCount++; else inactiveCount++;

            // Filter logic: NEVER hide empty-user inactive rows
            if(filterStatusValue==="Active" && status!=="Active" && !isEmptyUser) return;

            const tr = document.createElement("tr");
            tr.dataset.row = r._rowIndex;
            tr.dataset.status = status;
            tr.dataset.emptyUser = isEmptyUser;

            tr.innerHTML = `
<td>${index++}</td>
<td>${r.Equipment||""}</td>
<td>${r["Equipment Description"]||""}</td>
<td>${r["Serial Number"]||""}</td>
<td>${r["DOK B-CORD"]||""}</td>
<td>${userVal}</td>
<td>${r.Location||""}</td>
<td>
<span class="status ${status==="Inactive"?"inactive":"active"}"
 onclick="toggleStatus(${r._rowIndex},'${userVal}','${status}')">${status}</span>
</td>
<td><button class="edit-btn" onclick="editRow(this,${r._rowIndex})">Edit</button></td>
<td><button class="delete-btn" onclick="deleteRow(${r._rowIndex})">Delete</button></td>
`;
            tbody.appendChild(tr);
        });

        summary.textContent = `Total: ${allData.length} | Active: ${activeCount} | Inactive: ${inactiveCount}`;
    }

    // Filter Active only (Empty-user Inactive always visible)
    function filterActiveOnly() {
        filterStatusValue = filterStatusValue==="ALL" ? "Active" : "ALL";
        render();
    }

    // Toggle status
    function toggleStatus(rowIndex,user,status){
        if(user===""){
            alert("User empty → must be Inactive");
            return;
        }
        const newStatus = status==="Active"?"Inactive":"Active";
        updateRow(rowIndex,{Status:newStatus});
    }

    // Edit row
    function editRow(btn,rowIndex){
        const tr = btn.closest("tr");
        const tds = tr.querySelectorAll("td");

        if(btn.textContent==="Edit"){
            for(let i=1;i<=6;i++) tds[i].innerHTML = `<input value="${tds[i].textContent}">`;
            btn.textContent="Save";
        }else{
            const rowData = {
                Equipment: tds[1].querySelector("input").value.trim(),
                "Equipment Description": tds[2].querySelector("input").value.trim(),
                "Serial Number": tds[3].querySelector("input").value.trim(),
                "DOK B-CORD": tds[4].querySelector("input").value.trim(),
                User: tds[5].querySelector("input").value.trim(),
                Location: tds[6].querySelector("input").value.trim()
            };
            if(rowData.User==="") rowData.Status="Inactive";
            updateRow(rowIndex,rowData);
        }
    }

    // Delete row
    function deleteRow(rowIndex){
        if(confirm("Delete this row?")){
            fetch(API,{method:"POST",body:JSON.stringify({action:"delete",rowIndex})}).then(loadData);
        }
    }

    // Add row
    function addRow(){
        const tr = document.createElement("tr");
        tr.innerHTML = `
<td>*</td>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
<td>Active</td>
<td><button class="edit-btn" onclick="saveNew(this)">Save</button></td>
<td><button class="delete-btn" onclick="this.closest('tr').remove()">Cancel</button></td>
`;
        tbody.prepend(tr);
    }

    // Save new row
    function saveNew(btn){
        const tr = btn.closest("tr");
        const c = tr.children;
        const userVal = c[5].querySelector("input").value.trim();
        const statusVal = userVal===""?"Inactive":"Active";

        const row = {
            "Equipment": c[1].querySelector("input").value.trim(),
            "Equipment Description": c[2].querySelector("input").value.trim(),
            "Serial Number": c[3].querySelector("input").value.trim(),
            "DOK B-CORD": c[4].querySelector("input").value.trim(),
            "User": userVal,
            "Location": c[6].querySelector("input").value.trim(),
            "Status": statusVal
        };

        fetch(API,{method:"POST",body:JSON.stringify({action:"add",row})}).then(loadData);
    }

    // Update row
    function updateRow(rowIndex,row){
        fetch(API,{method:"POST",body:JSON.stringify({action:"update",rowIndex,row})}).then(loadData);
    }

    // Search (empty-user Inactive always visible)
    searchBox.onkeyup = () => {
        const q = searchBox.value.toLowerCase();
        [...tbody.rows].forEach(r=>{
            const userEmpty = r.dataset.emptyUser==="true";
            if(userEmpty) {
                r.style.display = "";
                return;
            }
            r.style.display = r.textContent.toLowerCase().includes(q) ? "" : "none";
        });
    };

    loadData();
    setInterval(loadData,60000);
</script>

</body>
</html>
