<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Office Asset List – Admin Login</title>

<style>
body{font-family:Segoe UI;background:#f4f6f8;padding:20px}
h2{text-align:center;margin-bottom:10px}
#loginBox,#controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}
button{padding:6px 12px;border:none;border-radius:5px;cursor:pointer}
.edit-btn{background:#43a047;color:#fff}
.delete-btn{background:#e53935;color:#fff}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#1976d2;color:#fff}
.status{cursor:pointer;font-weight:bold;padding:4px 14px;border-radius:14px}
.active{background:#e8f5e9;color:#2e7d32}
.inactive{background:#fdecea;color:#c62828}
.status.disabled{opacity:.5;cursor:not-allowed}
.readonly{opacity:.6}
input{width:100%;box-sizing:border-box}
</style>
</head>

<body>

<h2>🏢 Office Asset List</h2>

<!-- LOGIN -->
<div id="loginBox">
  <input id="loginEmail" placeholder="Enter your email">
  <button onclick="login()">Login</button>
</div>

<!-- CONTROLS -->
<div id="controls" style="display:none;">
  <button onclick="loadData()">🔄 Reload</button>
  <button id="addBtn" onclick="addRow()">➕ Add Asset</button>
  <button onclick="downloadExcel()">⬇️ Download Excel</button>
  <input id="searchBox" placeholder="🔍 Search...">
</div>

<div id="summary"></div>

<table>
<thead>
<tr>
<th>No</th>
<th>Equipment</th>
<th>Description</th>
<th>Serial</th>
<th>DOK</th>
<th>User</th>
<th>Location</th>
<th>Status</th>
<th>Comment</th>
<th>Edit</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>
/* ================= CONFIG ================= */
const ADMIN_USERS = ["admin@dok.com","it@dok.com"];
const API="https://script.google.com/macros/s/AKfycbwXpn362zREgNE_K0JasXzNVOcW8u0XlGimELEmVUtIMkz2IF3ohFyPR8EjJnbAd0bSBQ/exec";

let currentUser="", isAdmin=false, allData=[], isBusy=false;

const tbody=document.getElementById("tbody");
const searchBox=document.getElementById("searchBox");
const summary=document.getElementById("summary");
const addBtn=document.getElementById("addBtn");
const controls=document.getElementById("controls");

/* ================= LOGIN ================= */
function login(){
  currentUser=document.getElementById("loginEmail").value.trim().toLowerCase();
  if(!currentUser){alert("Enter email");return;}

  isAdmin=ADMIN_USERS.includes(currentUser);
  document.getElementById("loginBox").style.display="none";
  controls.style.display="flex";
  addBtn.style.display=isAdmin?"inline-block":"none";

  loadData();
}

/* ================= LOAD DATA ================= */
async function loadData(){
 if(isBusy) return;
 const res=await fetch(API);
 allData=await res.json();

 // enforce empty user inactive
 allData.forEach(r=>{
  const user = (r.User || "").trim();

  // If user empty → force Inactive
  if(user === "" && r.Status !== "Inactive"){
    updateRow(r._rowIndex,{Status:"Inactive"},false);
  }

  // If user exists → force Active
  if(user !== "" && r.Status !== "Active"){
    updateRow(r._rowIndex,{Status:"Active"},false);
  }
});

 render();
}

/* ================= RENDER ================= */
function render(){
 tbody.innerHTML="";
 let i=1,ac=0,ic=0;

 allData.forEach(r=>{
   const user=(r.User||"").trim();
   const empty=user==="";
   const status=empty?"Inactive":(r.Status||"Active");
   status==="Active"?ac++:ic++;

   const tr=document.createElement("tr");
   tr.className=isAdmin?"":"readonly";

   tr.innerHTML=`
<td>${i++}</td>
<td>${r.Equipment||""}</td>
<td>${r["Equipment Description"]||""}</td>
<td>${r["Serial Number"]||""}</td>
<td>${r["DOK B-CORD"]||""}</td>
<td>${user}</td>
<td>${r.Location||""}</td>
<td>
<span class="status ${status==="Active"?"active":"inactive"} ${(!isAdmin||empty)?"disabled":""}"
onclick="toggleStatus(${r._rowIndex})">${status}</span>
</td>
<td>${r.Comment||""}</td>
<td>${isAdmin?`<button class="edit-btn" onclick="editRow(this,${r._rowIndex})">Edit</button>`:"-"}</td>
<td>${isAdmin?`<button class="delete-btn" onclick="deleteRow(${r._rowIndex})">Delete</button>`:"-"}</td>
`;
   tbody.appendChild(tr);
 });

 summary.textContent=
 `User: ${currentUser} | Role: ${isAdmin?"Admin":"Viewer"} | Total: ${allData.length} | Active: ${ac} | Inactive: ${ic}`;
}

/* ================= SEARCH ================= */
searchBox.onfocus=()=>isBusy=true;
searchBox.onblur=()=>isBusy=false;
searchBox.onkeyup=()=>{
 const q=searchBox.value.toLowerCase();
 [...tbody.rows].forEach(r=>{
   r.style.display=r.textContent.toLowerCase().includes(q)?"":"none";
 });
};

/* ================= STATUS ================= */
function toggleStatus(rowIndex){
 if(!isAdmin){alert("Admin only");return;}
 const r=allData.find(x=>x._rowIndex===rowIndex);
 if(!r || (r.User||"").trim()===""){alert("User empty → Inactive");return;}
 updateRow(rowIndex,{Status:r.Status==="Active"?"Inactive":"Active"});
}

/* ================= EDIT ================= */
function editRow(btn,rowIndex){
 if(!isAdmin){alert("Admin only");return;}
 isBusy=true;
 const tr=btn.closest("tr");
 const t=tr.querySelectorAll("td");

 if(btn.textContent==="Edit"){
   for(let i=1;i<=8;i++){
     t[i].innerHTML=`<input value="${t[i].textContent}">`;
   }
   btn.textContent="Save";
 }else{
   const row={
     Equipment:t[1].querySelector("input").value.trim(),
     "Equipment Description":t[2].querySelector("input").value.trim(),
     "Serial Number":t[3].querySelector("input").value.trim(),
     "DOK B-CORD":t[4].querySelector("input").value.trim(),
     User:t[5].querySelector("input").value.trim(),
     Location:t[6].querySelector("input").value.trim(),
     Comment:t[8].querySelector("input").value.trim()
   };
   if(row.User==="") row.Status="Inactive";
   updateRow(rowIndex,row);
 }
}

/* ================= DELETE ================= */
function deleteRow(rowIndex){
 if(!isAdmin){alert("Admin only");return;}
 if(confirm("Delete asset permanently?")){
   isBusy=true;
   fetch(API,{method:"POST",body:JSON.stringify({action:"delete",rowIndex})})
   .then(()=>{isBusy=false;loadData();});
 }
}

/* ================= ADD ================= */
function addRow(){
 if(!isAdmin){alert("Admin only");return;}
 isBusy=true;
 const tr=document.createElement("tr");
 tr.innerHTML=`
<td>*</td>
<td><input></td><td><input></td><td><input></td>
<td><input></td><td><input></td><td><input></td>
<td>Active</td>
<td><input></td>
<td><button class="edit-btn" onclick="saveNew(this)">Save</button></td>
<td><button class="delete-btn" onclick="this.closest('tr').remove();isBusy=false;">Cancel</button></td>
`;
 tbody.prepend(tr);
}

/* ================= SAVE NEW ================= */
function saveNew(btn){
 const tr=btn.closest("tr");
 const c=tr.children;
 const user=c[5].querySelector("input").value.trim();

 const row={
   Equipment:c[1].querySelector("input").value.trim(),
   "Equipment Description":c[2].querySelector("input").value.trim(),
   "Serial Number":c[3].querySelector("input").value.trim(),
   "DOK B-CORD":c[4].querySelector("input").value.trim(),
   User:user,
   Location:c[6].querySelector("input").value.trim(),
   Comment:c[8].querySelector("input").value.trim(),
   Status:user===""?"Inactive":"Active"
 };

 fetch(API,{method:"POST",body:JSON.stringify({action:"add",row})})
 .then(()=>{isBusy=false;loadData();});
}

/* ================= UPDATE ================= */
function updateRow(rowIndex,row,refresh=true){
 isBusy=true;
 fetch(API,{method:"POST",body:JSON.stringify({action:"update",rowIndex,row})})
 .then(()=>{isBusy=false;if(refresh)loadData();});
}

/* ================= EXCEL DOWNLOAD ================= */
function downloadExcel(){
  const data = [
    ["Equipment","Description","Serial","DOK","User","Location","Status","Comment"]
  ];

  [...tbody.rows].forEach(tr=>{
    if(tr.style.display==="none") return;
    const t = tr.querySelectorAll("td");
    data.push([
      t[1].innerText,
      t[2].innerText,
      t[3].innerText,
      t[4].innerText,
      t[5].innerText,
      t[6].innerText,
      t[7].innerText,
      t[8].innerText
    ]);
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(data);

  XLSX.utils.book_append_sheet(wb, ws, "Assets");
  XLSX.writeFile(wb, "Office_Asset_List.xlsx");
}

/* ================= AUTO REFRESH ================= */
setInterval(()=>{if(!isBusy)loadData();},60000);
  
</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

</body>
</html>
